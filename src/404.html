<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- @include head-security.html -->
    <title>Page not found – deltadr.ai</title>
    <meta name="robots" content="noindex" />
    <!-- @include head-assets.html -->
  </head>
  <body class="h-full w-full overflow-hidden bg-white font-sans text-brand-ink">
    <!-- @include backdrop.html -->

    <!-- GitHub Pages serves this file for any unknown path at any depth, so every URL on it
       is root-absolute. -->
    <main id="page" tabindex="-1" lang="en" class="fixed inset-0 z-5 overflow-y-auto outline-none">
      <div
        class="flex min-h-full items-center justify-center px-4 pt-[5.5rem] pb-28 min-[481px]:px-[clamp(1.25rem,5vw,3rem)] min-[481px]:pt-24 min-[481px]:pb-32"
      >
        <div
          class="w-full max-w-[640px] rounded-3xl bg-white/82 p-[clamp(1.75rem,4vw,3rem)] text-center shadow-[0_20px_60px_rgba(16,16,20,0.12)] backdrop-blur-[6px]"
        >
          <h1
            tabindex="-1"
            class="mb-4 text-[length:clamp(1.9rem,4.5vw,3rem)] font-extrabold text-brand-ink outline-none"
          >
            Page not found
          </h1>
          <p class="mb-7 text-[length:clamp(1rem,2.2vw,1.15rem)] leading-[1.6] text-brand-ink/75">
            The page you are looking for does not exist or has moved.
          </p>
          <nav hx-boost="true" hx-target="#page" hx-select="#page" hx-swap="outerHTML swap:300ms">
            <a
              href="/"
              class="inline-block rounded-xl bg-brand-teal-700 px-[1.6rem] py-[0.85rem] font-semibold text-white transition-colors duration-200 hover:bg-brand-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-teal-700"
              >Back to the start page</a
            >
          </nav>
        </div>
      </div>
    </main>

    <!-- @include footer.html -->

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
